name: Update Pricing

on:
  schedule:
    # 每6小时更新一次 (北京时间 0/6/12/18 点)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate pricing tables
        run: |
          python scripts/gen_pricing.py
        env:
          README_PATH: README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_KO.md README_JA.md README_ES.md README_DE.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "💰 Auto-update pricing tables $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
